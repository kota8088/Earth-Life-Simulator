<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Earth Life Simulator - 3D地球シミュレーター" />
    <title>Earth Life Simulator</title>
  </head>
  <body>
    <!-- ローディング画面 -->
    <div id="loading-screen" class="overlay">
      <div class="loading-content">
        <div class="spinner"></div>
        <p class="loading-text">地球を読み込み中...</p>
      </div>
    </div>

    <!-- エラー画面 -->
    <div id="error-screen" class="overlay hidden">
      <div class="error-content">
        <h2>読み込みエラー</h2>
        <p id="error-message">Cesiumの読み込みに失敗しました。</p>
        <button id="retry-button" type="button">再読み込み</button>
      </div>
    </div>

    <!-- Cesiumコンテナ -->
    <div id="cesiumContainer"></div>

    <!-- ヘッダー -->
    <header id="app-header">
      <h1 id="app-title">Earth Life Simulator</h1>
      <button id="settings-button" type="button" aria-label="設定">⚙️</button>
    </header>

    <!-- 操作説明（左下） -->
    <div id="controls-help">
      <div class="help-title">操作方法</div>
      <div class="help-row"><span class="key">W A S D</span> 移動</div>
      <div class="help-row"><span class="key">Shift</span> ダッシュ</div>
      <div class="help-row"><span class="key">Space</span> ジャンプ</div>
      <div class="help-row"><span class="key">V</span> 視点切替</div>
      <div class="help-row"><span class="key">M</span> 設定</div>
      <div class="help-row"><span class="key">Click</span> マウス固定</div>
      <div class="help-row"><span class="key">ESC</span> マウス解放</div>
    </div>

    <!-- スタミナゲージ（下部中央） -->
    <div id="stamina-container">
      <div class="stamina-label">STAMINA</div>
      <div class="stamina-bar">
        <div id="stamina-fill" class="stamina-fill"></div>
      </div>
      <div id="stamina-value" class="stamina-value">100</div>
    </div>

    <!-- 視点モード表示（下部右） -->
    <div id="view-mode-indicator">1st Person</div>

    <!-- オートセーブ通知（右上、ヘッダーの下） -->
    <div id="autosave-indicator" class="hidden">💾 自動保存</div>

    <!-- 設定パネル -->
    <div id="settings-panel" class="hidden">
      <div class="settings-header">
        <span>設定</span>
        <button id="settings-close" type="button" aria-label="閉じる">✕</button>
      </div>
      <div class="settings-body">
        <div class="settings-section">
          <div class="settings-section-title">性別</div>
          <div class="gender-buttons">
            <button id="gender-male" type="button" class="gender-button active">男性 🧍‍♂️</button>
            <button id="gender-female" type="button" class="gender-button">女性 🧍‍♀️</button>
          </div>
        </div>

        <div class="settings-section">
          <div class="settings-section-title">視野角（FOV）</div>
          <div class="fov-row">
            <input id="fov-slider" type="range" min="30" max="110" step="1" value="60" />
            <span id="fov-value" class="fov-value">60°</span>
          </div>
          <div class="fov-hint">一人称・三人称の両方に適用されます</div>
        </div>

        <div class="settings-section">
          <div class="settings-section-title">セーブデータ</div>
          <button id="save-now" type="button" class="save-button">今すぐ保存</button>
          <div id="last-saved" class="last-saved">最終保存: --:--</div>
          <div class="autosave-hint">オートセーブ: 5秒ごと</div>
        </div>
      </div>
    </div>

    <!-- Pointer Lock 案内 -->
    <div id="click-to-play">
      <div class="click-to-play-inner">
        <div class="click-icon">🖱️</div>
        <div class="click-text">クリックしてプレイ開始</div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
